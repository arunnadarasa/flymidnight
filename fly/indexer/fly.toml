# Midnight indexer (public — the browser hits this over HTTPS/WSS).
#
# Deploy: FLY_ACCESS_TOKEN=... flyctl deploy -c fly/indexer/fly.toml --remote-only

app        = "choreo-indexer"
primary_region = "iad"

[build]
  image = "midnightntwrk/indexer-standalone:4.0.2"

[env]
  RUST_LOG                                = "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
  APP__INFRA__NODE__URL                   = "ws://choreo-node.internal:9944"
  APP__APPLICATION__NETWORK_ID            = "undeployed"
  APP__INFRA__STORAGE__PASSWORD           = "indexer"
  APP__INFRA__PUB_SUB__PASSWORD           = "indexer"
  APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD = "indexer"
  APP__INFRA__SECRET                      = "303132333435363738393031323334353637383930313233343536373839303132"
  # Fly's 6PN network is IPv6-only; bind the GraphQL API to all IPv6 addresses
  # so other apps can reach choreo-indexer.internal:8088.
  APP__INFRA__API__ADDRESS                = "::"

[http_service]
  internal_port       = 8088
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "1gb"
